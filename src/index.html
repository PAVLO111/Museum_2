<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2Museum</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <!-- #endregion -->
  <!-- #region header -->
  <body>
    <header class="header">
      <div class="container">
        <section class="header__top-bar">
          <a href="#" class="header__logo">
            <img src="./images/header/logo-mb.svg" alt="Logo">
          </a>

          <div class="header__icons">
            <a href="#" class="header__menu">
              <img src="./images/header/menu-icon.svg" alt="Icon menu">
            </a>
            <a href="#" class="header__language">
              <img src="./images/header/language-icon.svg" alt="Language switch">
            </a>
          </div>
        </section>

        <section class="header__content">
          <div class="header__text">
            <h6 class="header__time">10 серпня - 10 листопада</h6>
            <h1 class="header__title">Мистецтво ХІХ - ХХ ст.</h1>
            <p class="header__info">Внесок українських митців у світову культуру 19-20 ст.</p>
            
            <a class="header__button" href="#">Купити квиток</a>
          </div>

          <div class="header__image">
            <img
              class="header__p"
              src="./images/header/header-image-mb.png"
              alt="Girl in the Ukrainian national clothers"
            >
          </div>
        </section>
      </div>
    </header>
    <!-- #endregion -->
    <!-- #region main -->
    <main class="main"></main>
    <!-- #endregion -->
    <!-- #region footer -->
    <footer class="footer"></footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
<!-- #endregion -->
